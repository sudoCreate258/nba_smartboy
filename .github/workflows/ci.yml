name: CI

on:
  push:
  pull_request:

# Read-only token: the workflow never needs write access, and it never runs on the
# privileged "target" variant of pull-request events (tests/test_repo_hygiene.py).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twin
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twin -d twin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      # The phone app's JavaScript: syntax only (it is not run in a browser here).
      - run: python manage.py render_service_worker --out sw-rendered.js
      - run: node --check ui/static/ui/offline.js && node --check sw-rendered.js
