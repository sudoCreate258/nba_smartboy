name: CI

on:
  push:
  pull_request:

# Read-only token: the workflow never needs write access, and it never runs on the
# privileged "target" variant of pull-request events (tests/test_repo_hygiene.py).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twin
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twin -d twin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The backup tests need rclone and the PostgreSQL 16 client tools (the same ones the app image
      # has). rclone comes from the Ubuntu archive; the 16 client from the official PostgreSQL apt
      # repository, so dumps match the postgres:16 service.
      - name: Install rclone and the PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - run: pg_dump --version && pg_restore --version && rclone version
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      # The phone app's JavaScript: syntax only (it is not run in a browser here).
      - run: python manage.py render_service_worker --out sw-rendered.js
      - run: node --check ui/static/ui/offline.js && node --check sw-rendered.js

  # Vulnerability gate (M6 R3): the same script as scripts/scan.ps1. osv-scanner from Alpine 3.20 in the
  # official alpine image; the image is read from a `docker save` tar, never through the Docker socket.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t twin-web:scan .
      - run: mkdir -p scan-out && docker save -o scan-out/web.tar twin-web:scan
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/scan-out/web.tar:/in/web.tar:ro" -v "$PWD/scan-out:/out"
          alpine:3.20 sh /repo/scripts/scan.sh
