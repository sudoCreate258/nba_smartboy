services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twin}
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      # This computer only, unless LAN mode is on (TWIN_LAN_HOST in .env, trusted home network only).
      - "${TWIN_LAN_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # LAN HTTPS (M6), opt-in: `docker compose --profile https up -d web-https`. A TLS server (gunicorn)
  # on TWIN_HTTPS_HOST:8443 with the certificate from scripts/lan-cert.ps1 (certs/, gitignored, mounted
  # read-only). Only this process runs with TWIN_HTTPS=1 (secure cookies, HSTS).
  web-https:
    build: .
    profiles: ["https"]
    command: >-
      gunicorn twin.wsgi:application --bind 0.0.0.0:8443 --workers 2 --access-logfile -
      --certfile /run/secrets/tls/server.crt --keyfile /run/secrets/tls/server.key
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      TWIN_HTTPS: "1"
    ports:
      - "${TWIN_HTTPS_HOST:-127.0.0.1}:8443:8443"
    volumes:
      - .:/app
      - ./certs/server:/run/secrets/tls:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  # Encrypted off-hours backup (M4.5), opt-in: `docker compose --profile backup up -d backup`.
  # The rclone config (with the crypt remote) stays outside the repository and is mounted
  # read-only into this service only; set RCLONE_CONFIG_HOST in .env (see docs/OPERATIONS.md).
  backup:
    build: .
    profiles: ["backup"]
    command: python manage.py backup_loop
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - .:/app
      - ${RCLONE_CONFIG_HOST:-./backup-not-configured/rclone.conf}:/run/secrets/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
