{% extends "ui/base.html" %}
{% block title %}Log in - Twin{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if form.non_field_errors %}<p class="error" role="alert">{{ form.non_field_errors|join:" " }}</p>{% endif %}
<form method="post" class="stack">
  {% csrf_token %}
  <label for="id_username">Username</label>
  <input id="id_username" name="username" autocomplete="username" autocapitalize="none" required value="{{ form.username.value|default:'' }}">
  <label for="id_password">Password</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="primary">Log in</button>
</form>
{% endblock %}
